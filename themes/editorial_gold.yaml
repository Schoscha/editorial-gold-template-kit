# ==============================================================================
# Editorial Gold Theme für Home Assistant (HA 2026+)
# Stil: Warm-Anthrazit · Gebürstetes Gold · Champagner-Creme
# Anpassbar für jedes Projekt über die Farb-Tokens am Anfang der Datei.
# ==============================================================================

Editorial Gold:
  # --- Projekt-Farb-Tokens (für neue Projekte hier anpassen) ---
  editorial-bg-deep: "#12161c"
  editorial-bg-surface: "#1a2028"
  editorial-bg-elevated: "#222933"
  editorial-gold: "#d4af37"
  editorial-gold-soft: "#e6c978"
  editorial-gold-border: "rgba(212, 175, 55, 0.28)"
  editorial-gold-glow: "rgba(212, 175, 55, 0.14)"
  editorial-cream: "#f3ead8"
  editorial-ink: "#181c22"
  editorial-text: "#f4efe6"
  editorial-text-muted: "#b8b2a6"

  # --- Globale Home Assistant Farben ---
  primary-color: "var(--editorial-gold)"
  accent-color: "var(--editorial-gold-soft)"
  dark-primary-color: "#b38f28"
  light-primary-color: "var(--editorial-cream)"

  # --- Hintergründe & Header ---
  primary-background-color: "var(--editorial-bg-deep)"
  secondary-background-color: "var(--editorial-bg-surface)"
  lovelace-background: "radial-gradient(circle at 85% 15%, rgba(212, 175, 55, 0.08), transparent 45%), linear-gradient(180deg, #12161c 0%, #0e1217 100%)"
  app-header-background-color: "rgba(18, 22, 28, 0.92)"
  app-header-text-color: "var(--editorial-cream)"
  app-header-border-bottom: "1px solid var(--editorial-gold-border)"

  # --- Sidebar ---
  sidebar-background-color: "#141920"
  sidebar-text-color: "var(--editorial-text-muted)"
  sidebar-icon-color: "var(--editorial-text-muted)"
  sidebar-selected-background-color: "rgba(212, 175, 55, 0.14)"
  sidebar-selected-icon-color: "var(--editorial-gold-soft)"
  sidebar-selected-text-color: "var(--editorial-cream)"

  # --- Karten & Oberflächen ---
  ha-card-background: "var(--editorial-bg-surface)"
  card-background-color: "var(--editorial-bg-surface)"
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--editorial-gold-border)"
  ha-card-box-shadow: "0 8px 24px rgba(0, 0, 0, 0.35)"

  # --- Moderne HA Surface & Form Tokens (HA 2025/2026) ---
  ha-color-surface-default: "var(--editorial-bg-surface)"
  ha-color-surface-low: "var(--editorial-bg-elevated)"
  ha-color-surface-lower: "var(--editorial-bg-deep)"
  ha-color-on-surface-default: "var(--editorial-text)"
  ha-color-on-neutral-normal: "var(--editorial-text)"
  ha-color-text-primary: "var(--editorial-text)"
  ha-color-text-secondary: "var(--editorial-text-muted)"
  ha-color-fill-neutral-quiet-resting: "rgba(243, 234, 216, 0.06)"
  ha-color-fill-neutral-quiet-hover: "rgba(212, 175, 55, 0.14)"
  ha-color-fill-neutral-normal-resting: "rgba(243, 234, 216, 0.10)"
  ha-color-fill-neutral-normal-hover: "rgba(212, 175, 55, 0.20)"
  ha-color-fill-primary-quiet-resting: "rgba(212, 175, 55, 0.16)"
  ha-color-fill-primary-quiet-hover: "rgba(212, 175, 55, 0.26)"
  ha-color-form-background: "#232a34"
  ha-color-form-background-hover: "#2a323e"
  ha-color-form-background-disabled: "#181d24"
  wa-color-neutral-fill-normal: "rgba(243, 234, 216, 0.08)"

  # --- Eingabefelder & Dropdowns (Dialoge / Einstellungen) ---
  input-ink-color: "var(--editorial-text)"
  input-fill-color: "#232a34"
  input-disabled-fill-color: "#181d24"
  input-label-ink-color: "var(--editorial-text-muted)"
  input-disabled-ink-color: "rgba(184, 178, 166, 0.55)"
  input-dropdown-icon-color: "var(--editorial-gold-soft)"
  input-idle-line-color: "var(--editorial-gold-border)"
  input-hover-line-color: "var(--editorial-gold)"
  mdc-theme-surface: "var(--editorial-bg-surface)"
  mdc-text-field-fill-color: "#232a34"
  mdc-text-field-ink-color: "var(--editorial-text)"
  mdc-text-field-label-ink-color: "var(--editorial-text-muted)"
  mdc-text-field-disabled-fill-color: "#181d24"
  mdc-text-field-disabled-ink-color: "rgba(184, 178, 166, 0.55)"
  mdc-select-fill-color: "#232a34"
  mdc-select-ink-color: "var(--editorial-text)"
  mdc-select-label-ink-color: "var(--editorial-text-muted)"
  mdc-select-dropdown-icon-color: "var(--editorial-gold-soft)"
  md-list-container-color: "var(--editorial-bg-surface)"

  # --- Texte & Trennlinien ---
  primary-text-color: "var(--editorial-text)"
  secondary-text-color: "var(--editorial-text-muted)"
  text-primary-color: "var(--editorial-ink)"
  disabled-text-color: "rgba(184, 178, 166, 0.45)"
  divider-color: "rgba(212, 175, 55, 0.18)"

  # --- Status & Schalter ---
  state-icon-color: "var(--editorial-text-muted)"
  state-icon-active-color: "var(--editorial-gold-soft)"
  state-light-active-color: "var(--editorial-gold-soft)"
  switch-checked-button-color: "var(--editorial-cream)"
  switch-checked-track-color: "var(--editorial-gold)"
  switch-unchecked-button-color: "#9aa0a6"
  switch-unchecked-track-color: "#2d3540"
  slider-color: "var(--editorial-gold)"
  slider-secondary-color: "var(--editorial-gold-soft)"
  slider-bar-color: "rgba(243, 234, 216, 0.15)"

  # --- Mushroom Tokens ---
  mush-card-primary-font-weight: "600"
  mush-card-secondary-font-weight: "400"
  mush-border-radius: "16px"
  mush-control-border-radius: "12px"
  mush-chip-background: "rgba(26, 32, 40, 0.9)"
  mush-chip-border-color: "var(--editorial-gold-border)"
  mush-chip-border-width: "1px"
  rgb-amber: "212, 175, 55"
  rgb-state-light: "212, 175, 55"
  rgb-state-switch: "212, 175, 55"
  rgb-state-media-player: "212, 175, 55"
  mush-rgb-amber: "212, 175, 55"
  mush-rgb-yellow: "230, 201, 120"
  mush-rgb-green: "126, 189, 138"
  mush-rgb-red: "217, 108, 108"
  mush-rgb-blue: "122, 168, 214"
  mush-rgb-state-light: "212, 175, 55"
  mush-rgb-state-switch: "212, 175, 55"
  mush-rgb-state-media-player: "212, 175, 55"
  mush-rgb-state-person-home: "126, 189, 138"

  # --- Dialoge & Popups ---
  mdc-dialog-surface-color: "var(--editorial-bg-surface)"
  paper-dialog-background-color: "var(--editorial-bg-surface)"
  ha-dialog-surface-background: "var(--editorial-bg-surface)"
  ha-dialog-border-radius: "18px"
  table-row-background-color: "var(--editorial-bg-deep)"
  table-row-alternative-background-color: "var(--editorial-bg-surface)"

  # --- Card-Mod Global Feinschliff ---
  card-mod-theme: "Editorial Gold"
  card-mod-root-yaml: |
    .: |
      ha-app-layout {
        letter-spacing: 0.01em;
      }
  card-mod-card: |
    ha-card {
      border: 1px solid rgba(212, 175, 55, 0.25);
      transition: border-color 0.2s ease, transform 0.15s ease;
    }
    ha-card:hover {
      border-color: rgba(212, 175, 55, 0.55);
    }

  modes:
    dark:
      primary-background-color: "#12161c"
      secondary-background-color: "#1a2028"
      ha-color-form-background: "#232a34"
      ha-color-surface-default: "#1a2028"
      ha-color-on-surface-default: "#f4efe6"
      input-fill-color: "#232a34"
      input-ink-color: "#f4efe6"
